<!DOCTYPE html>
<html data-theme="cupcake" lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme-aware favicons: let modern browsers pick by media query -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg?v=5"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg?v=5"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Fallback canonical favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=5" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Atomology — learn the periodic table with fun games: multiple choice, open-answer, and hangman modes."
    />
    <meta name="robots" content="index,follow" />
    <!-- Open Graph -->
    <meta property="og:title" content="Atomology" />
    <meta
      property="og:description"
      content="Learn the periodic table with games and challenges — multiple choice, hangman, and open-answer modes."
    />
    <meta property="og:url" content="https://atomology.vercel.app/" />
    <meta
      property="og:image"
      content="https://atomology.vercel.app/favicon-512.png"
    />
    <meta property="og:type" content="website" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Atomology" />
    <meta
      name="twitter:description"
      content="Learn the periodic table with games and challenges."
    />
    <meta
      name="twitter:image"
      content="https://atomology.vercel.app/favicon-512.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomology</title>
    <link rel="canonical" href="https://atomology.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Graduate&family=Michroma&display=swap"
      rel="stylesheet"
    />
    <!-- Inline style to reserve vertical scrollbar immediately to avoid layout shift -->
    <style>
      html,
      body {
        overflow: hidden; /* Make root full-height with hidden overflow */
      }
    </style>
    <script>
      // set --vh early so layout using the variable doesn't flicker
      (function () {
        try {
          document.documentElement.style.setProperty(
            "--vh",
            window.innerHeight * 0.01 + "px"
          );
        } catch (e) {}
      })();
    </script>
    <!-- JSON-LD structured data is injected at runtime from `src/main.jsx` to
     avoid it accidentally rendering as visible text in some build/configs. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
